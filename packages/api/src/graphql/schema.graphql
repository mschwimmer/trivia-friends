scalar DateTime

enum ScoreDirection {
  ADD
  SUBTRACT
}

type User {
  id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!
  displayName: String
}

type Question {
  id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!
  prompt: String!
  answer: String!
  creatorId: ID!
  creator: User!
}

type Board {
  id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!
  ownerId: ID!
  owner: User!
  title: String!
  description: String
  isPublic: Boolean!
  dailyDoubleClue: BoardClue
  categories: [BoardCategory!]!
  clues: [BoardClue!]!
}

type BoardCategory {
  id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!
  boardId: ID!
  colIndex: Int!
  title: String!
  clues: [BoardClue!]!
}

type BoardClue {
  id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!
  boardId: ID!
  colIndex: Int!
  rowIndex: Int!
  value: Int!
  questionId: ID!
  question: Question
}

type GameSession {
  id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!
  boardId: ID
  board: Board
  hostUserId: ID
  hostUser: User
  title: String
  players: [SessionPlayer!]!
  clues: [SessionClue!]!
}

type SessionPlayer {
  id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!
  sessionId: ID!
  position: Int!
  name: String!
  score: Int!
}

type SessionClue {
  id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!
  sessionId: ID!
  boardClueId: ID
  colIndex: Int!
  rowIndex: Int!
  value: Int!
  categoryTitle: String!
  prompt: String!
  answer: String!
  isDailyDouble: Boolean!
  opened: Boolean!
}

type StartGameSessionPayload {
  session: GameSession!
  guestHostToken: String
}

input CreateBoardInput {
  title: String!
  description: String
  isPublic: Boolean = true
}

input UpdateBoardInput {
  title: String
  description: String
  isPublic: Boolean
}

input AddBoardCategoryInput {
  boardId: ID!
  title: String!
  colIndex: Int!
}

input UpdateBoardCategoryInput {
  title: String
  colIndex: Int
}

input QuestionSelectionInput {
  questionId: ID
  prompt: String
  answer: String
}

input AddBoardClueInput {
  boardId: ID!
  colIndex: Int!
  rowIndex: Int!
  value: Int!
  question: QuestionSelectionInput!
}

input UpdateBoardClueInput {
  colIndex: Int
  rowIndex: Int
  value: Int
  question: QuestionSelectionInput
}

input StartGameSessionInput {
  boardId: ID!
  title: String
  playerNames: [String!]!
}

type Query {
  health: String!
  me: User
  publicBoards(limit: Int = 20, offset: Int = 0): [Board!]!
  board(id: ID!): Board
  myBoards(limit: Int = 20, offset: Int = 0): [Board!]!
  myQuestions(search: String, limit: Int = 20, offset: Int = 0): [Question!]!
  gameSession(id: ID!, guestHostToken: String): GameSession
}

type Mutation {
  updateDisplayName(displayName: String!): User!

  createBoard(input: CreateBoardInput!): Board!
  updateBoard(id: ID!, input: UpdateBoardInput!): Board!
  deleteBoard(id: ID!): Boolean!

  addBoardCategory(input: AddBoardCategoryInput!): BoardCategory!
  updateBoardCategory(id: ID!, input: UpdateBoardCategoryInput!): BoardCategory!
  reorderBoardCategories(boardId: ID!, categoryIds: [ID!]!): Board!
  deleteBoardCategory(id: ID!): Boolean!

  addBoardClue(input: AddBoardClueInput!): BoardClue!
  updateBoardClue(id: ID!, input: UpdateBoardClueInput!): BoardClue!
  deleteBoardClue(id: ID!): Boolean!
  selectDailyDouble(boardId: ID!, clueId: ID!): Board!

  startGameSession(input: StartGameSessionInput!): StartGameSessionPayload!
  addSessionPlayer(
    sessionId: ID!
    name: String!
    guestHostToken: String
  ): SessionPlayer!
  renameSessionPlayer(
    id: ID!
    name: String!
    guestHostToken: String
  ): SessionPlayer!
  removeSessionPlayer(id: ID!, guestHostToken: String): Boolean!
  openSessionClue(id: ID!, guestHostToken: String): SessionClue!
  adjustPlayerScore(
    playerId: ID!
    clueId: ID!
    direction: ScoreDirection!
    guestHostToken: String
  ): SessionPlayer!
  applyDailyDoubleResult(
    playerId: ID!
    clueId: ID!
    wager: Int!
    correct: Boolean!
    guestHostToken: String
  ): SessionPlayer!
}
