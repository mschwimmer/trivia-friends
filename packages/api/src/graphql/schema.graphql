enum AuthProvider {
  GOOGLE
}

scalar DateTime

type User {
  id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!
  displayName: String
  authProvider: AuthProvider!
  providerUid: String!
  email: String
  boards: [Board!]!
  questions: [Question!]!
  gameSessions: [GameSession!]!
}

type Question {
  id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!
  prompt: String!
  answer: String!
  creatorId: ID!
  creator: User!
  boardClues: [BoardClue!]!
}

type Board {
  id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!
  ownerId: ID!
  owner: User!
  title: String!
  description: String
  isPublic: Boolean!
  dailyDoubleClue: BoardClue
  dailyDoubleClueId: ID
  categories: [BoardCategory!]!
  clues: [BoardClue!]!
  sessions: [GameSession!]!
}

type BoardCategory {
  id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!
  boardId: ID!
  board: Board!
  colIndex: Int!
  title: String!
  clues: [BoardClue!]!
}

type BoardClue {
  id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!
  boardId: ID!
  board: Board!
  colIndex: Int!
  rowIndex: Int!
  category: BoardCategory!
  value: Int!
  questionId: ID!
  question: Question!
  dailyDoubleForBoard: Board
  sessionClues: [SessionClue!]!
}

type GameSession {
  id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!
  boardId: ID
  board: Board
  hostUserId: ID
  hostUser: User
  title: String
  players: [SessionPlayer!]!
  clues: [SessionClue!]!
}

type SessionPlayer {
  id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!
  sessionId: ID!
  session: GameSession!
  position: Int!
  name: String!
  score: Int!
}

type SessionClue {
  id: ID!
  createdAt: DateTime!
  updatedAt: DateTime!
  sessionId: ID!
  session: GameSession!
  boardClueId: ID
  boardClue: BoardClue
  colIndex: Int!
  rowIndex: Int!
  value: Int!
  categoryTitle: String!
  prompt: String!
  answer: String!
  isDailyDouble: Boolean!
  opened: Boolean!
}

type Query {
  health: String!
}
